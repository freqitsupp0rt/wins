name: Remote Deploy
on:
  push:
    branches: [ wins ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /srv/wins-nms
            
            # 1. Setup Git if the folder isn't a repo yet
            if [ ! -d .git ]; then
              git init
              git remote add origin git@github.com:freqitsupp0rt/wins.git
            fi
            
            # 2. Sync with the wins branch
            git fetch origin wins
            git reset --hard origin/wins
            
            # 3. Clean Build
            npm install
            rm -rf .next
            npm run build
            
            # 4. Process Management
            pm2 restart wins --update-env --cwd /srv/wins-nms
            pm2 save